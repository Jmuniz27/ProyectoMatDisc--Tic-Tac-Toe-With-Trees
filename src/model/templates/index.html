<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe - TAWS</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --taws-blue: #00CFFF;
      --taws-orange: #FFA300;
      --bg-color: #081C36;
      --card-bg: #0F2A4E;
      --white: #ffffff;
      --cell-bg: #0b1e36;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(145deg, var(--bg-color), #040D1A);
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .title-block {
      text-align: center;
      margin-top: 30px;
    }

    .title-block img {
      height: 80px;
      filter: drop-shadow(0 0 10px white);
      margin-bottom: 10px;
    }

    .title-block h1 {
      font-size: 2.8em;
      color: var(--taws-blue);
      text-shadow: 0 0 12px white;
      margin: 0;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 40px;
      padding: 40px 20px;
      max-width: 1200px;
      width: 100%;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      flex: 1 1 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    h3 {
      font-size: 1.4em;
      color: var(--taws-orange);
      text-shadow: 0 0 8px var(--taws-orange);
      margin-bottom: 20px;
      text-align: center;
    }

    .video-box img {
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      border: 3px solid var(--taws-blue);
      box-shadow: 0 0 16px var(--taws-blue);
      display: block;
      margin: auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 16px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: var(--cell-bg);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6em;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .cell:hover {
      transform: scale(1.08);
      box-shadow: 0 0 18px var(--taws-orange);
    }

    .cell .x {
      color: var(--taws-blue);
      text-shadow: 0 0 6px var(--taws-blue), 0 0 12px var(--taws-blue);
    }

    .cell .o {
      color: var(--taws-orange);
      text-shadow: 0 0 6px var(--taws-orange), 0 0 12px var(--taws-orange);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .buttons button {
      font-size: 1em;
      padding: 12px 24px;
      background: #102940;
      color: var(--taws-blue);
      font-weight: bold;
      border: 2px solid var(--taws-orange);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--taws-orange);
      transition: all 0.3s ease;
    }

    .buttons button:hover {
      background-color: var(--taws-orange);
      color: #fff;
      box-shadow: 0 0 25px var(--taws-orange);
    }

    .message {
      background: #0f3c57;
      border-left: 6px solid var(--taws-blue);
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 1.3em;
      text-align: center;
      color: white;
      box-shadow: 0 0 20px rgba(0, 207, 255, 0.3);
      margin: 0 auto;
      max-width: 500px;
    }
  </style>
</head>

<body>

  <!-- Logo y título centrado -->
  <div class="title-block">
    <img src="{{ url_for('static', filename='logo_taws.png') }}" alt="Logo TAWS" />
    <h1>Tic Tac Toe</h1>
  </div>

  <div class="layout">
    <!-- Cámara -->
    <div class="card">
      <h3>📸 Cámara</h3>
      <div class="video-box">
        <img src="{{ url_for('video_feed') }}" alt="Cámara en vivo" />
      </div>
    </div>

    <!-- Tablero -->
    <div class="card">
      <h3>🎮 Tablero</h3>
      <div class="board">
        {% for row in matrix %}
          {% for cell in row %}
            <div class="cell">
              {% if cell == 'X' %}
                <span class="x">X</span>
              {% elif cell == 'O' %}
                <span class="o">O</span>
              {% endif %}
            </div>
          {% endfor %}
        {% endfor %}
      </div>

      <div class="buttons">
        <form action="{{ url_for('start_game') }}" method="get">
          <button type="submit">🔁 Nuevo Juego</button>
        </form>
        <form action="{{ url_for('next_round') }}" method="get">
          <button type="submit">📸 Capturar Jugada</button>
        </form>
      </div>

      {% if message %}
        <div class="message">{{ message }}</div>
      {% endif %}
    </div>
  </div>

</body>
</html>
